managePackageManagerVersions: false

allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  core-js-pure: false
  esbuild: true
  keccak: false
  unrs-resolver: true
  utf-8-validate: false

overrides:
  minimatch@9: ^9.0.9
  postcss: ^8.5.32
  ws@8: ^8.21.0
  uuid@<11.1.1: ^11.1.1
  decode-uri-component: ^0.5.0
  '@reown/appkit-adapter-wagmi>@wagmi/connectors': ^6.2.0
  viem@2: ^2.57.12

minimumReleaseAgeExclude:
  - '@storybook/addon-docs@10.6.5'
  - '@storybook/builder-vite@10.6.5'
  - '@storybook/nextjs-vite@10.6.5'
  - '@storybook/react-dom-shim@10.6.5'
  - '@storybook/react-vite@10.6.5'
  - '@storybook/react@10.6.5'
  - eslint-plugin-storybook@10.6.5
  - storybook@10.6.5
  - vite-plugin-storybook-nextjs@10.6.5
